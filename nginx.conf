# /etc/nginx/site-enabled/n0n4w3.cn

server {
    if ($host = n0n4w3.cn) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name n0n4w3.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name n0n4w3.cn;

    ssl_certificate /etc/letsencrypt/live/n0n4w3.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n0n4w3.cn/privkey.pem;

    root /var/www/n0n4w3.cn;
    index index.html;

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 博客文件和 manifest
    location /blogs/ {
        add_header Cache-Control "no-cache";
    }

    # API proxy to health check backend (localhost:3001)
    # GET /api/health returns JSON with status, uptime, timestamp, and dependency checks
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }
}
