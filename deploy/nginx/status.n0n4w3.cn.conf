# /etc/nginx/site-enabled/status.n0n4w3.cn
#
# Uptime Kuma public status page at https://status.n0n4w3.cn
# Requires:
#   - Uptime Kuma Docker container running on 127.0.0.1:3002
#   - Let's Encrypt SSL cert covering status.n0n4w3.cn
#     (wildcard *.n0n4w3.cn or standalone cert)

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name status.n0n4w3.cn;
    return 301 https://$host$request_uri;
}

# HTTPS with reverse proxy to Uptime Kuma
server {
    listen 443 ssl http2;
    server_name status.n0n4w3.cn;

    # SSL — reuse wildcard cert from main site, or replace with standalone cert paths
    ssl_certificate /etc/letsencrypt/live/n0n4w3.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n0n4w3.cn/privkey.pem;

    # Reverse proxy to Uptime Kuma Docker container
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support — required for Uptime Kuma live status updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
